[project]
name = "idx-portfolio"
version = "1.0.0"
description = "IDX stock portfolio analyzer with Ollama LLM and Telegram alerts"
requires-python = ">=3.11"
dependencies = [
    "yfinance==1.3.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "streamlit>=1.35.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.0"]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
