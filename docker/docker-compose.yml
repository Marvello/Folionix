services:

  # ── PostgreSQL database ──
  idx-db:
    image: postgres:18.3-alpine
    container_name: idx-db
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-idx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-idx_portfolio}
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - idx-net

  # ── Telegram bot ──
  idx-bot:
    image: ghcr.io/marvello/my-stocks:latest
    container_name: idx-bot
    restart: unless-stopped
    user: root
    env_file: ../.env
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ../data:/project/data
    extra_hosts:
      - "debian-tower:host-gateway"
    command: python -m app.bot
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('https://api.telegram.org', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      idx-db:
        condition: service_healthy
    networks:
      - idx-net

  # ── Streamlit UI ──
  idx-ui:
    image: ghcr.io/marvello/my-stocks:latest
    container_name: idx-ui
    restart: unless-stopped
    user: root
    env_file: ../.env
    environment:
      - TZ=Asia/Jakarta
      - PYTHONPATH=/project
    volumes:
      - ../data:/project/data
    ports:
      - "8501:8501"
    command: python -m streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.dockflare.enable=true"
      - "com.dockflare.hostname=idx-portfolio"
    depends_on:
      idx-db:
        condition: service_healthy
    networks:
      - idx-net

  # ── LangGraph orchestrator ──
  idx-graph:
    image: ghcr.io/marvello/my-stocks:latest
    container_name: idx-graph
    restart: unless-stopped
    user: root
    env_file: ../.env
    environment:
      - TZ=Asia/Jakarta
      - GRAPH_SEND_TELEGRAM=true
    volumes:
      - ../data:/project/data
    extra_hosts:
      - "debian-tower:host-gateway"
    command: python -m app.graph.runner
    depends_on:
      idx-db:
        condition: service_healthy
    networks:
      - idx-net

networks:
  idx-net:
    driver: bridge
