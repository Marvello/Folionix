# Bounded json-file logs (default is unbounded and fills the disk over months).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # Pin a deploy: FOLIONIX_TAG=<8-char-sha> docker compose -f docker/docker-compose.yml up -d
  # (CI pushes both :latest and :<sha> tags; default is latest.)

  # ── Postgres ──
  folionix-db:
    image: postgres:18-alpine
    container_name: folionix-db
    restart: unless-stopped
    logging: *logging
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-folionix}
      - POSTGRES_USER=${POSTGRES_USER:-folionix}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    # postgres:18 keeps PGDATA in /var/lib/postgresql/18/docker, so the volume mounts the
    # parent dir. A volume created under postgres:17 (mounted at .../data) can NOT be reused:
    # pg_dump on 17, then restore into a fresh 18 volume.
    volumes:
      - pgdata:/var/lib/postgresql
    # Services reach the DB over the compose network; publish to loopback only (psql from the host).
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-folionix}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Telegram bot ──
  folionix-bot:
    image: marvellooni/folionix-app:${FOLIONIX_TAG:-latest}
    container_name: folionix-bot
    restart: unless-stopped
    logging: *logging
    env_file: ../.env
    environment:
      - TZ=Asia/Jakarta
      - DATABASE_URL=postgresql://${POSTGRES_USER:-folionix}:${POSTGRES_PASSWORD}@folionix-db:5432/${POSTGRES_DB:-folionix}
    extra_hosts:
      - "ollama-host:host-gateway"
    command: node dist/bot/bot.js
    depends_on:
      folionix-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

  # ── LangGraph orchestrator ──
  folionix-graph:
    image: marvellooni/folionix-app:${FOLIONIX_TAG:-latest}
    container_name: folionix-graph
    restart: unless-stopped
    logging: *logging
    env_file: ../.env
    environment:
      - TZ=Asia/Jakarta
      - DATABASE_URL=postgresql://${POSTGRES_USER:-folionix}:${POSTGRES_PASSWORD}@folionix-db:5432/${POSTGRES_DB:-folionix}
    extra_hosts:
      - "ollama-host:host-gateway"
    command: node dist/graph/runner.js
    # Heartbeat stamped every loop; a cycle can run long (daily baseline), hence 1h.
    healthcheck:
      test: ["CMD", "node", "dist/utils/heartbeat.js", "3600"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      folionix-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Multi-agent analysis worker (drains analysis_jobs) ──
  folionix-worker:
    image: marvellooni/folionix-app:${FOLIONIX_TAG:-latest}
    container_name: folionix-worker
    restart: unless-stopped
    logging: *logging
    env_file: ../.env
    environment:
      - TZ=Asia/Jakarta
      - DATABASE_URL=postgresql://${POSTGRES_USER:-folionix}:${POSTGRES_PASSWORD}@folionix-db:5432/${POSTGRES_DB:-folionix}
    extra_hosts:
      - "ollama-host:host-gateway"
    command: node dist/graph/worker.js
    healthcheck:
      test: ["CMD", "node", "dist/utils/heartbeat.js", "1800"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      folionix-db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Next.js web UI ──
  folionix-web:
    image: marvellooni/folionix-web:${FOLIONIX_TAG:-latest}
    container_name: folionix-web
    restart: unless-stopped
    logging: *logging
    environment:
      - TZ=Asia/Jakarta
      - DATABASE_URL=postgresql://${POSTGRES_USER:-folionix}:${POSTGRES_PASSWORD}@folionix-db:5432/${POSTGRES_DB:-folionix}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET required}
      - AIREVIEW_API_TOKEN=${AIREVIEW_API_TOKEN:-}   # unset = /api/weekly-reviews/latest disabled (503)
      - NEXT_PUBLIC_APP_VERSION=${FOLIONIX_TAG:-latest}
    ports:
      - "3000:3000"
    healthcheck:   # image has no curl/wget; /api/health also checks the DB
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      folionix-db:
        condition: service_healthy
    labels:
      - "com.dockflare.enable=true"
      - "com.dockflare.hostname=folionix"
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
