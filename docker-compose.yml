services:

  # ── Cron scheduler (replaces host crontab) ──
  idx-cron:
    image: ghcr.io/marvello/my-stocks:latest
    container_name: idx-cron
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./portfolio.json:/app/portfolio.json
      - ./data:/app/data
    extra_hosts:
      - "debian-tower:host-gateway"
    command: supercronic /app/crontab

  # ── Telegram bot ──
  idx-bot:
    image: ghcr.io/marvello/my-stocks:latest
    container_name: idx-bot
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./portfolio.json:/app/portfolio.json
      - ./data:/app/data
    extra_hosts:
      - "debian-tower:host-gateway"
    command: python /app/bot.py
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('https://api.telegram.org', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ── Streamlit UI ──
  idx-ui:
    image: ghcr.io/marvello/my-stocks:latest
    container_name: idx-ui
    restart: unless-stopped
    env_file: .env
    environment:
      - TZ=Asia/Jakarta
    volumes:
      - ./portfolio.json:/app/portfolio.json
      - ./data:/app/data
    ports:
      - "8501:8501"
    command: streamlit run /app/ui.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.dockflare.enable=true"
      - "com.dockflare.hostname=idx-portfolio"
