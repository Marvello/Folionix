# Build + push images to Docker Hub, multi-arch (amd64 + arm64).
# App and web are independent chains (test → build → merge), each gated on a
# path filter so a push only rebuilds the image whose sources actually changed.
#
# Repo secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME    — Docker Hub username (marvellooni)
#   DOCKERHUB_TOKEN       — Docker Hub access token (read/write)
# Deployment is outside this workflow: it only publishes the :latest / :<sha8> images.
# NEXT_PUBLIC_* are not needed: the web image reads them at runtime.

name: build

on:
  # PRs run only the test jobs (build/merge are push-only below) — nothing is
  # published until main, and main IS the deploy (prod pulls :latest).
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Skip the whole workflow when a push touches ONLY these paths.
    # Use [skip ci] in the commit message for a one-off manual skip.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'docker/docker-compose.yml'
      - 'tasks/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  # Decide which image(s) changed. The workflow file itself rebuilds both.
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read   # paths-filter lists PR files through the API
    outputs:
      app: ${{ steps.filter.outputs.app }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'lib/**'
              - 'db/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker/Dockerfile.app'
              - '.github/workflows/build.yml'
            web:
              - 'web/**'
              - 'lib/**'
              - 'package.json'
              - 'package-lock.json'
              - 'docker/Dockerfile.web'
              - '.github/workflows/build.yml'

  # ── App (TypeScript) chain ──
  test-app:
    needs: changes
    if: ${{ needs.changes.outputs.app == 'true' }}
    runs-on: ubuntu-26.04
    # Throwaway Postgres: proves schema.sql + every migration apply cleanly (no
    # drift) and runs the live-DB tests (src/db/*.integration.test.ts).
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: folionix
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: folionix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U folionix" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://folionix:ci@localhost:5432/folionix
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: app
      - run: npx tsc --noEmit
        working-directory: app
      - name: Load schema.sql and apply migrations
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
          DATABASE_URL="$TEST_DATABASE_URL" npm run migrate --workspace app
          DATABASE_URL="$TEST_DATABASE_URL" npm run migrate --workspace app -- --check
      - run: npx vitest run
        working-directory: app

  build-app:
    needs: test-app
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push app image (by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.app
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          outputs: type=image,name=marvellooni/folionix-app,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: app-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge-app:
    needs: build-app
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: app-digests-*
          merge-multiple: true
      - id: vars
        run: echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t marvellooni/folionix-app:latest \
            -t marvellooni/folionix-app:${{ steps.vars.outputs.sha8 }} \
            $(printf 'marvellooni/folionix-app@sha256:%s ' $(ls /tmp/digests))

  # ── Web (Next.js) chain ──
  test-web:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-26.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  build-web:
    needs: test-web
    if: ${{ github.event_name == 'push' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute build date
        id: bd
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Build + push web image (by digest)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.web
          platforms: linux/${{ matrix.arch }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.bd.outputs.date }}
          outputs: type=image,name=marvellooni/folionix-web,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: web-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  merge-web:
    needs: build-web
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: web-digests-*
          merge-multiple: true
      - id: vars
        run: echo "sha8=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t marvellooni/folionix-web:latest \
            -t marvellooni/folionix-web:${{ steps.vars.outputs.sha8 }} \
            $(printf 'marvellooni/folionix-web@sha256:%s ' $(ls /tmp/digests))